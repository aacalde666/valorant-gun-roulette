<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c131a" />
      <stop offset="50%" stop-color="#14212e" />
      <stop offset="100%" stop-color="#080d12" />
    </linearGradient>

    <!-- Crimson Valorant Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e6c" />
      <stop offset="100%" stop-color="#ff4655" />
    </linearGradient>

    <!-- Neon Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="100%" stop-color="#00b875" />
    </linearGradient>

    <!-- Steel Gray Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a5169" />
      <stop offset="100%" stop-color="#1e2c3a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="mintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Chamfered Tactical Badge -->
  <polygon points="120,30 392,30 482,120 482,392 392,482 120,482 30,392 30,120" 
           fill="url(#bgGrad)" 
           stroke="#253a4e" 
           stroke-width="6" />

  <!-- Inner Angular Border -->
  <polygon points="130,46 382,46 466,130 466,382 382,466 130,466 46,382 46,130" 
           fill="none" 
           stroke="#ff4655" 
           stroke-width="3" 
           stroke-dasharray="140 20 40 20" 
           opacity="0.85" />

  <!-- Corner Tactical Pips -->
  <circle cx="120" cy="50" r="4" fill="#00f59b" filter="url(#mintGlow)" />
  <circle cx="392" cy="50" r="4" fill="#00f59b" filter="url(#mintGlow)" />
  <circle cx="462" cy="120" r="4" fill="#ff4655" filter="url(#crimsonGlow)" />
  <circle cx="462" cy="392" r="4" fill="#ff4655" filter="url(#crimsonGlow)" />
  <circle cx="392" cy="462" r="4" fill="#00f59b" filter="url(#mintGlow)" />
  <circle cx="120" cy="462" r="4" fill="#00f59b" filter="url(#mintGlow)" />
  <circle cx="50" cy="392" r="4" fill="#ff4655" filter="url(#crimsonGlow)" />
  <circle cx="50" cy="120" r="4" fill="#ff4655" filter="url(#crimsonGlow)" />

  <!-- Stylized Angular Chevron Wings (The Unique Outer Emblem) -->
  <!-- Left Wing -->
  <polygon points="110,130 180,130 236,256 166,256" 
           fill="url(#crimsonGrad)" 
           filter="url(#crimsonGlow)" />
  <!-- Right Wing -->
  <polygon points="402,130 332,130 276,256 346,256" 
           fill="url(#crimsonGrad)" 
           filter="url(#crimsonGlow)" />

  <!-- Central Roulette / Revolver Cylinder Ring (Outer Gear) -->
  <circle cx="256" cy="256" r="120" 
          fill="#101a24" 
          stroke="#2d4459" 
          stroke-width="12" />

  <!-- 6 Segment Notches (Representing the 6 Weapon Tiers: Pistols, SMGs, Shotguns, Rifles, Snipers, Heavies) -->
  <!-- Tier 1: Top (90 deg) -->
  <circle cx="256" cy="162" r="16" fill="#0c141d" stroke="#00f59b" stroke-width="4" filter="url(#mintGlow)" />
  <!-- Tier 2: Top Right (30 deg) -->
  <circle cx="337" cy="209" r="16" fill="#0c141d" stroke="#ff4655" stroke-width="4" filter="url(#crimsonGlow)" />
  <!-- Tier 3: Bottom Right (330 deg) -->
  <circle cx="337" cy="303" r="16" fill="#0c141d" stroke="#5bb2d6" stroke-width="4" />
  <!-- Tier 4: Bottom (270 deg) -->
  <circle cx="256" cy="350" r="16" fill="#0c141d" stroke="#00f59b" stroke-width="4" filter="url(#mintGlow)" />
  <!-- Tier 5: Bottom Left (210 deg) -->
  <circle cx="175" cy="303" r="16" fill="#0c141d" stroke="#ff4655" stroke-width="4" filter="url(#crimsonGlow)" />
  <!-- Tier 6: Top Left (150 deg) -->
  <circle cx="175" cy="209" r="16" fill="#0c141d" stroke="#5bb2d6" stroke-width="4" />

  <!-- Inner Reticle Crosshair -->
  <circle cx="256" cy="256" r="54" 
          fill="none" 
          stroke="#00f59b" 
          stroke-width="4" 
          stroke-dasharray="30 12" 
          filter="url(#mintGlow)" />

  <!-- Crosshair Spikes -->
  <line x1="256" y1="184" x2="256" y2="214" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="298" x2="256" y2="328" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="184" y1="256" x2="214" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <line x1="298" y1="256" x2="328" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Center Core Pip -->
  <circle cx="256" cy="256" r="14" fill="#ff4655" filter="url(#crimsonGlow)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />

  <!-- Bottom Tactical Chevron Indicator -->
  <polygon points="216,420 296,420 256,456" 
           fill="#ff4655" 
           filter="url(#crimsonGlow)" />
</svg>
